# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a7c0e8b8d776c951f5a0764156ba1cfc"
name = "bundlekit"
application_url = "https://bundlekit.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "customers/data_request" ]
  uri = "https://bundlekit.onrender.com/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = [ "customers/redact" ]
  uri = "https://bundlekit.onrender.com/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = [ "shop/redact" ]
  uri = "https://bundlekit.onrender.com/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,write_discounts"

[auth]
redirect_urls = [ "https://bundlekit.onrender.com/api/auth" ]